[workspace]
members = [
    "lynx-server",
    "lynx-protocol",
    "lynx-load",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rauf Latifli <r.m.latifli@student.utwente.nl>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency
dashmap = "5.5"

# Configuration
dotenvy = "0.15"
config = "0.14"

# Testing & benchmarking
criterion = "0.5"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# HTTP server for health endpoints
axum = "0.7"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Random
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
debug = true  # keep symbols for profiling
